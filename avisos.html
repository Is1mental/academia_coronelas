<body>

      <nav class="menu" id="menu" aria-label="Principal">

  </header>

  <main id="main">
    <article class="page">
      <div class="wrap page__body">
        <p class="eyebrow"><span class="eyebrow__bar"></span>Comunicados</p>

  <footer class="foot">

      <div class="foot__brand">

      <p class="foot__links" id="foot-links"><a href="index.html#programa">Programa</a><a href="index.html#categorias">Categorías</a><a href="index.html#horarios">Horarios</a><a href="index.html#inscripcion">Clase de prueba</a></p>

    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/data.js?v=14"></script>
  <script src="script.js?v=14"></script>
  <script src="js/site.js?v=14"></script>
  <script>
    (async () => {
      const D = AcademiaData, $ = id => document.getElementById(id);
      const title = $("n-title"), body = $("n-body"), list = $("n-list"), meta = $("n-meta"), back = $("n-back");
      const day = d => (d ? new Date(d + "T12:00:00").toLocaleDateString("es-MX", { dateStyle: "long" }) : "");
      const clean = html => window.DOMPurify ? DOMPurify.sanitize(html || "", { ALLOWED_TAGS: ["p","br","h2","h3","h4","strong","em","u","s","ul","ol","li","blockquote","a","hr","img"], ALLOWED_ATTR: ["href","src","alt","target","rel"], ALLOWED_URI_REGEXP: /^(?:https?:|mailto:|data:image\/)/i }) : "";
      const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
      const off = (t, m) => { title.textContent = t; body.textContent = m; document.title = t + " | Academia Elite"; };
      let features = { notices: true }, rows = [];
      try { features = await D.getSetting("features", { notices: true }); } catch {}
      if (features.notices === false) return off("Avisos", "Esta sección no está disponible por el momento.");
      try { rows = await D.list("notices", { where: { status: "published" }, orderBy: "publish_date", asc: false }); } catch {}
      const id = new URLSearchParams(location.search).get("id");
      if (id) {
        const n = rows.find(x => x.id === id);
        if (!n) { off("Aviso no encontrado", "El aviso que buscas no existe o ya no está disponible."); back.textContent = "← Ver todos los avisos"; back.href = "avisos.html"; return; }
        document.title = n.title + " | Academia Elite";
        title.textContent = n.title;
        meta.textContent = [day(n.publish_date), n.audience].filter(Boolean).join(" · "); meta.hidden = false;
        body.innerHTML = clean(n.content);
        body.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
        back.textContent = "← Todos los avisos"; back.href = "avisos.html";
        return;
      }
      document.title = "Avisos | Academia Elite";
      if (!rows.length) return off("Avisos", "Por ahora no hay avisos publicados.");
      rows.sort((a, b) => (b.pinned - a.pinned) || String(b.publish_date).localeCompare(String(a.publish_date)));
      list.replaceChildren(...rows.map(n => {
        const a = el("a", "notice" + (n.pinned ? " notice--pin" : "")); a.href = "avisos.html?id=" + encodeURIComponent(n.id);
        const k = el("span", "notice__k", [n.pinned ? "Fijado" : "", day(n.publish_date), n.audience].filter(Boolean).join(" · "));
        a.append(k, el("h2", "", n.title), el("p", "", n.summary || ""), el("span", "notice__more", "Leer aviso →"));
        return a;
      }));
    })();
  </script>
</body>
</html>
